<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0f12">

<title>EVNTRS | Offline</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0d0f12;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 24px;
}

.card {
  max-width: 400px;
}

.icon {
  font-size: 60px;
  margin-bottom: 20px;
}

h1 {
  font-size: 28px;
  margin-bottom: 12px;
}

p {
  color: #aaa;
  line-height: 1.6;
}

button {
  margin-top: 20px;
  padding: 14px 24px;
  border: none;
  border-radius: 12px;
  background: #d7b778;
  color: #111;
  font-weight: bold;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="card">
  <div class="icon">📡</div>

  <h1>You're Offline</h1>

  <p>
    EVNTRS needs an internet connection to sync your event bookings.
    Please reconnect and try again.
  </p>

  <button onclick="location.reload()">
    Try Again
  </button>
</div>

</body>
</html>
